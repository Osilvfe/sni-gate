name: Temporary log cleanup driver

on:
  push:
    branches:
      - work/log-severity-cleanup

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/log-severity-cleanup
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm cmake clang

      - name: Apply narrow log cleanup
        shell: python
        run: |
          from pathlib import Path

          h3 = Path("src/h3_proxy.rs")
          text = h3.read_text()
          old = '''    let serve = async {
              while let Some(resolver) = inbound.accept().await.context("accepting HTTP/3 request")? {
          '''
          new = '''    let serve = async {
              loop {
                  let resolver = match inbound.accept().await {
                      Ok(Some(resolver)) => resolver,
                      Ok(None) => return Ok::<(), anyhow::Error>(()),
                      Err(error) if error.is_h3_no_error() => {
                          debug!(
                              %peer,
                              route = %context.route_name,
                              "H3 connection closed normally"
                          );
                          return Ok::<(), anyhow::Error>(());
                      }
                      Err(error) => {
                          return Err(error).context("accepting HTTP/3 request");
                      }
                  };
          '''
          if text.count(old) != 1:
              raise SystemExit(f"H3 accept loop prefix mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)
          old = '''              });
              }
              Ok::<(), anyhow::Error>(())
          };
          '''
          new = '''              });
              }
          };
          '''
          if text.count(old) != 1:
              raise SystemExit(f"H3 accept loop suffix mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''        let error = poll_fn(|cx| driver.poll_close(cx)).await;
                  debug!(route = %route_name, error = %error, "upstream H3 driver closed");
          '''
          new = '''        let close = poll_fn(|cx| driver.poll_close(cx)).await;
                  if close.is_h3_no_error() {
                      debug!(route = %route_name, "upstream H3 driver closed normally");
                  } else {
                      debug!(
                          route = %route_name,
                          error = %close,
                          "upstream H3 driver closed with error"
                      );
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"H3 upstream close log mismatch: {text.count(old)}")
          h3.write_text(text.replace(old, new, 1))

          psl = Path("src/psl.rs")
          text = psl.read_text()
          count = text.count("tracing::error!")
          if count != 6:
              raise SystemExit(f"expected 6 recoverable PSL error logs, found {count}")
          psl.write_text(text.replace("tracing::error!", "tracing::warn!"))

      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Sanity
        shell: python
        run: |
          from pathlib import Path
          h3 = Path("src/h3_proxy.rs").read_text()
          psl = Path("src/psl.rs").read_text()
          assert '"H3 connection failed"' not in h3
          assert 'H3 connection closed normally' in h3
          assert 'upstream H3 driver closed normally' in h3
          assert 'tracing::error!' not in psl

      - name: Restore CI and commit validated source
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/tmp-log-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(logging): distinguish recoverable and graceful closures"
          git push origin HEAD:work/log-severity-cleanup
