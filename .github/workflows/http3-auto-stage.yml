name: Stage automatic HTTP3 companion

on:
  push:
    branches:
      - tmp/http3-auto-companion
    paths:
      - .github/workflows/http3-auto-stage.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Patch HTTP3 companion support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # ---------------- config model ----------------
          replace_once(
              "src/config.rs",
              "use std::collections::HashMap;",
              "use std::collections::{HashMap, HashSet};",
          )

          replace_once(
              "src/config.rs",
              '''    /// Outermost `[http2]` defaults, inherited field-by-field by every route.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Policy for connections matching no route and no default_route.
              ''',
              '''    /// Outermost `[http2]` defaults, inherited field-by-field by every route.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Outermost `[http3]` defaults. When enabled for a TCP route, sni-gate
              /// may synthesize a QUIC companion listener on the same numeric address.
              #[serde(default)]
              pub http3: Option<Http3Config>,

              /// Policy for connections matching no route and no default_route.
              ''',
          )

          replace_once(
              "src/config.rs",
              '''    /// Listener-scope `[http2]` defaults, between `[global.http2]` and per-route.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Routes matched by inbound SNI/Host.
              ''',
              '''    /// Listener-scope `[http2]` defaults, between `[global.http2]` and per-route.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Listener-scope `[http3]` defaults, between `[global.http3]` and per-route.
              #[serde(default)]
              pub http3: Option<Http3Config>,

              /// Routes matched by inbound SNI/Host.
              ''',
          )

          replace_once(
              "src/config.rs",
              '''    /// HTTP/2 settings (deepest scope).
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Optional PEM cert chain pinned for local termination when this route's
              ''',
              '''    /// HTTP/2 settings (deepest scope).
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Automatic HTTP/3/QUIC companion settings (deepest scope).
              #[serde(default)]
              pub http3: Option<Http3Config>,

              /// Optional PEM cert chain pinned for local termination when this route's
              ''',
          )

          replace_once(
              "src/config.rs",
              '''    /// HTTP/2 settings; merged field-by-field into the HTTP/2 ladder here.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// Overridable knobs; inserted into the fallback ladder at this scope.
              ''',
              '''    /// HTTP/2 settings; merged field-by-field into the HTTP/2 ladder here.
              #[serde(default)]
              pub http2: Option<Http2Config>,

              /// HTTP/3 companion settings; merged into the same scope ladder.
              #[serde(default)]
              pub http3: Option<Http3Config>,

              /// Overridable knobs; inserted into the fallback ladder at this scope.
              ''',
          )

          replace_once(
              "src/config.rs",
              '''pub struct Http2Config {
                  /// Allow HTTP/2 on this route. Inherits; default false.
                  ///
                  /// For `tls`/`ech` the upstream's own ALPN choice is mirrored back to the
                  /// client, so enabling this only *permits* h2 — it is used when the upstream
                  /// actually selects it. For `http` the negotiated protocol is spliced to the
                  /// cleartext backend as prior-knowledge h2c. Meaningless for `raw` (which
                  /// never terminates TLS), where setting it explicitly is a load-time error.
                  #[serde(default)]
                  pub enabled: Option<bool>,

                  /// What a failed startup h2c probe does. Only applies to `http` routes
                  /// (`tls`/`ech` mirror the live upstream and need no probe).
                  #[serde(default)]
                  pub probe: Option<H2Probe>,

                  /// Per-backend timeout for the startup h2c probe. Default 3s.
                  #[serde(default, with = "humantime_serde::option")]
                  pub probe_timeout: Option<Duration>,
              }

              /// What a failed startup h2c probe should do.
              ''',
              '''pub struct Http2Config {
                  /// Allow HTTP/2 on this route. Inherits; default false.
                  ///
                  /// For `tls`/`ech` the upstream's own ALPN choice is mirrored back to the
                  /// client, so enabling this only *permits* h2 — it is used when the upstream
                  /// actually selects it. For `http` the negotiated protocol is spliced to the
                  /// cleartext backend as prior-knowledge h2c. Meaningless for `raw` (which
                  /// never terminates TLS), where setting it explicitly is a load-time error.
                  #[serde(default)]
                  pub enabled: Option<bool>,

                  /// What a failed startup h2c probe does. Only applies to `http` routes
                  /// (`tls`/`ech` mirror the live upstream and need no probe).
                  #[serde(default)]
                  pub probe: Option<H2Probe>,

                  /// Per-backend timeout for the startup h2c probe. Default 3s.
                  #[serde(default, with = "humantime_serde::option")]
                  pub probe_timeout: Option<Duration>,
              }

              /// Per-scope automatic HTTP/3 companion settings.
              ///
              /// `enabled = true` on a TCP listener causes eligible routes to be mirrored onto
              /// an automatically-created QUIC listener bound to the same numeric address:
              /// `tls -> h3`, `ech -> h3-ech`, and `raw -> raw`. A cleartext `http`
              /// route is not translated because H3 -> HTTP/1.1/h2c conversion is outside the
              /// current proxy model. The setting inherits through the same five-tier ladder
              /// as [`Http2Config`].
              #[derive(Debug, Clone, Deserialize)]
              #[serde(deny_unknown_fields)]
              pub struct Http3Config {
                  /// Enable automatic QUIC companion generation. Inherits; default false.
                  #[serde(default)]
                  pub enabled: Option<bool>,
              }

              /// What a failed startup h2c probe should do.
              ''',
          )

          replace_once(
              "src/config.rs",
              '''pub struct EffectiveHttp2 {
                  pub enabled: bool,
                  pub probe: H2Probe,
                  pub probe_timeout: Duration,
              }

              impl Config {
              ''',
              '''pub struct EffectiveHttp2 {
                  pub enabled: bool,
                  pub probe: H2Probe,
                  pub probe_timeout: Duration,
              }

              /// The fully-resolved `[http3]` switch for one configured TCP route.
              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              pub struct EffectiveHttp3 {
                  pub enabled: bool,
              }

              impl Config {
              ''',
          )

          replace_once(
              "src/config.rs",
              '''                self.validate_ech(a, r, rt_tpl, ln_tpl)?;
                              self.validate_http2(r, rt_tpl)?;
                          }
              ''',
              '''                self.validate_ech(a, r, rt_tpl, ln_tpl)?;
                              self.validate_http2(r, rt_tpl)?;
                              self.validate_http3(a, r, rt_tpl)?;
                          }
              ''',
          )
          replace_once(
              "src/config.rs",
              '''                self.validate_ech(a, d, rt_tpl, ln_tpl)?;
                              self.validate_http2(d, rt_tpl)?;
                          }
              ''',
              '''                self.validate_ech(a, d, rt_tpl, ln_tpl)?;
                              self.validate_http2(d, rt_tpl)?;
                              self.validate_http3(a, d, rt_tpl)?;
                          }
              ''',
          )

          insert_marker = '''    /// Reject an *explicit* HTTP/2 opt-in on a `raw` route. Only the two
          '''
          insert_block = '''    /// The five HTTP/3 tiers in deepest→shallowest order, mirroring HTTP/2.
              fn http3_tiers<'a>(
                  &'a self,
                  listener: &'a Listener,
                  route: &'a Route,
                  rt_tpl: Option<&'a Template>,
                  ln_tpl: Option<&'a Template>,
              ) -> Vec<&'a Http3Config> {
                  [
                      route.http3.as_ref(),
                      rt_tpl.and_then(|t| t.http3.as_ref()),
                      listener.http3.as_ref(),
                      ln_tpl.and_then(|t| t.http3.as_ref()),
                      self.global.http3.as_ref(),
                  ]
                  .into_iter()
                  .flatten()
                  .collect()
              }

              /// Resolve whether automatic HTTP/3 is enabled for one configured route.
              pub fn effective_http3(
                  &self,
                  listener: &Listener,
                  route: &Route,
                  rt_tpl: Option<&Template>,
                  ln_tpl: Option<&Template>,
              ) -> EffectiveHttp3 {
                  let tiers = self.http3_tiers(listener, route, rt_tpl, ln_tpl);
                  EffectiveHttp3 {
                      enabled: tiers.iter().find_map(|h| h.enabled).unwrap_or(false),
                  }
              }

              /// Map a configured TCP route type to its automatic QUIC companion type.
              pub fn http3_companion_route_type(route_type: RouteType) -> Option<RouteType> {
                  match route_type {
                      RouteType::Tls => Some(RouteType::H3),
                      RouteType::Ech => Some(RouteType::H3Ech),
                      RouteType::Raw => Some(RouteType::Raw),
                      RouteType::Http | RouteType::H3 | RouteType::H3Ech => None,
                  }
              }

              fn http3_companion_route(
                  &self,
                  listener: &Listener,
                  route: &Route,
                  ln_tpl: Option<&Template>,
              ) -> Result<Option<Route>, ConfigError> {
                  let rt_tpl = self.template_for(&route.use_template)?;
                  if !self
                      .effective_http3(listener, route, rt_tpl, ln_tpl)
                      .enabled
                  {
                      return Ok(None);
                  }
                  let route_type = Self::effective_route_type(route, rt_tpl).ok_or_else(|| {
                      ConfigError::Invalid(format!("route {}: missing type", route.label()))
                  })?;
                  let Some(companion_type) = Self::http3_companion_route_type(route_type) else {
                      return Ok(None);
                  };
                  let mut companion = route.clone();
                  // An explicit mapped type must beat a route template that may still carry the
                  // original TCP type. The http3 block itself has done its job and is cleared so
                  // the synthetic route cannot recursively request another companion.
                  companion.route_type = Some(companion_type);
                  companion.http3 = None;
                  Ok(Some(companion))
              }

              /// Build the automatic QUIC companion for one configured TCP listener.
              /// Returns `None` when no eligible route has HTTP/3 enabled.
              pub fn http3_companion_listener(
                  &self,
                  listener: &Listener,
              ) -> Result<Option<Listener>, ConfigError> {
                  if listener.transport != ListenerTransport::Tcp {
                      return Ok(None);
                  }
                  let ln_tpl = self.template_for(&listener.use_template)?;
                  let mut routes = Vec::new();
                  for route in &listener.routes {
                      if let Some(route) = self.http3_companion_route(listener, route, ln_tpl)? {
                          routes.push(route);
                      }
                  }
                  let default_route = match &listener.default_route {
                      Some(route) => self.http3_companion_route(listener, route, ln_tpl)?,
                      None => None,
                  };
                  if routes.is_empty() && default_route.is_none() {
                      return Ok(None);
                  }
                  let mut companion = listener.clone();
                  companion.transport = ListenerTransport::Quic;
                  companion.routes = routes;
                  companion.default_route = default_route;
                  companion.http3 = None;
                  Ok(Some(companion))
              }

              /// Return the listeners that should actually be bound at runtime.
              ///
              /// Configured listeners are preserved verbatim. A TCP listener may add one
              /// automatic QUIC companion unless the operator already configured a QUIC
              /// listener on the same socket address, in which case the explicit listener
              /// owns UDP and suppresses automatic generation entirely.
              pub fn expanded_listeners(&self) -> Result<Vec<Listener>, ConfigError> {
                  let explicit_quic: HashSet<SocketAddr> = self
                      .listeners
                      .iter()
                      .filter(|l| l.transport == ListenerTransport::Quic)
                      .map(|l| l.addr)
                      .collect();
                  let mut expanded = Vec::with_capacity(self.listeners.len().saturating_mul(2));
                  for listener in &self.listeners {
                      expanded.push(listener.clone());
                      if listener.transport == ListenerTransport::Tcp
                          && !explicit_quic.contains(&listener.addr)
                      {
                          if let Some(companion) = self.http3_companion_listener(listener)? {
                              expanded.push(companion);
                          }
                      }
                  }
                  Ok(expanded)
              }

          '''
          p = Path("src/config.rs")
          text = p.read_text()
          if text.count(insert_marker) != 1:
              raise SystemExit("src/config.rs: HTTP2 validation marker changed")
          p.write_text(text.replace(insert_marker, insert_block + insert_marker), encoding="utf-8")

          marker = '''    /// Resolve the concrete protocol type for `route`, taking the route's own
          '''
          block = '''    /// Reject an explicit route/template HTTP/3 opt-in where no automatic
              /// companion mapping exists. Broad listener/global defaults remain usable with
              /// mixed route types: unsupported inherited routes are simply skipped.
              fn validate_http3(
                  &self,
                  listener: &Listener,
                  route: &Route,
                  rt_tpl: Option<&Template>,
              ) -> Result<(), ConfigError> {
                  let explicit = [route.http3.as_ref(), rt_tpl.and_then(|t| t.http3.as_ref())]
                      .into_iter()
                      .flatten()
                      .any(|h| h.enabled == Some(true));
                  if !explicit {
                      return Ok(());
                  }
                  let route_type = Self::effective_route_type(route, rt_tpl).ok_or_else(|| {
                      ConfigError::Invalid(format!("route {}: missing type", route.label()))
                  })?;
                  if listener.transport == ListenerTransport::Tcp
                      && Self::http3_companion_route_type(route_type).is_some()
                  {
                      return Ok(());
                  }
                  Err(ConfigError::Invalid(format!(
                      "route {}: http3 cannot be enabled explicitly for `{}` on a {:?} listener",
                      route.label(),
                      route_type_name(route_type),
                      listener.transport
                  )))
              }

          '''
          p = Path("src/config.rs")
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit("src/config.rs: route type marker changed")
          p.write_text(text.replace(marker, block + marker), encoding="utf-8")

          # ---------------- runtime listener expansion ----------------
          replace_once(
              "src/main.rs",
              "use tracing::{debug, error, info};",
              "use tracing::{debug, error, info, warn};",
          )
          replace_once(
              "src/main.rs",
              '''async fn run(cfg: Config) -> Result<()> {
                  info!(
                      version = env!("CARGO_PKG_VERSION"),
                      listeners = cfg.listeners.len(),
                      "starting sni-gate"
                  );

                  // --- Dynamic certificate stack (shared across all listeners) ---
              ''',
              '''async fn run(cfg: Config) -> Result<()> {
                  let runtime_listeners = cfg
                      .expanded_listeners()
                      .context("expanding automatic HTTP/3 companion listeners")?;
                  log_http3_expansion(&cfg)?;
                  info!(
                      version = env!("CARGO_PKG_VERSION"),
                      configured_listeners = cfg.listeners.len(),
                      listeners = runtime_listeners.len(),
                      "starting sni-gate"
                  );

                  // --- Dynamic certificate stack (shared across all listeners) ---
              ''',
          )
          replace_once(
              "src/main.rs",
              '''    // --- Build every listener ---
                  let mut listener_states: Vec<Arc<ListenerState>> = Vec::new();
                  for listener in &cfg.listeners {
              ''',
              '''    // --- Build every configured listener plus automatic HTTP/3 companions ---
                  let mut listener_states: Vec<Arc<ListenerState>> = Vec::new();
                  for listener in &runtime_listeners {
              ''',
          )

          marker = '''/// Assemble one listener's router + route runtimes from config.
          fn build_listener(
          '''
          helper = '''/// Report automatic HTTP/3 expansion decisions that are useful to operators.
          fn log_http3_expansion(cfg: &Config) -> Result<()> {
              for listener in cfg
                  .listeners
                  .iter()
                  .filter(|l| l.transport == ListenerTransport::Tcp)
              {
                  let explicit_quic = cfg.listeners.iter().any(|q| {
                      q.transport == ListenerTransport::Quic && q.addr == listener.addr
                  });
                  let companion = cfg.http3_companion_listener(listener)?;
                  if explicit_quic {
                      if companion.is_some() {
                          info!(
                              addr = %listener.addr,
                              "explicit QUIC listener owns this address; automatic HTTP/3 companion suppressed"
                          );
                      }
                      continue;
                  }

                  let ln_tpl = cfg.template_for(&listener.use_template)?;
                  for route in listener.routes.iter().chain(listener.default_route.iter()) {
                      let rt_tpl = cfg.template_for(&route.use_template)?;
                      if !cfg
                          .effective_http3(listener, route, rt_tpl, ln_tpl)
                          .enabled
                      {
                          continue;
                      }
                      let Some(route_type) = Config::effective_route_type(route, rt_tpl) else {
                          continue;
                      };
                      if Config::http3_companion_route_type(route_type).is_none() {
                          warn!(
                              addr = %listener.addr,
                              route = %route.label(),
                              route_type = ?route_type,
                              "automatic HTTP/3 companion skipped: this route type has no H3 mapping"
                          );
                      }
                  }
                  if let Some(companion) = companion {
                      info!(
                          addr = %companion.addr,
                          routes = companion.routes.len(),
                          has_default_route = companion.default_route.is_some(),
                          "automatic HTTP/3 companion listener enabled"
                      );
                  }
              }
              Ok(())
          }

          /// Assemble one listener's router + route runtimes from config.
          fn build_listener(
          '''
          p = Path("src/main.rs")
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit("src/main.rs: build_listener marker changed")
          p.write_text(text.replace(marker, helper), encoding="utf-8")

          # ---------------- config tests ----------------
          p = Path("tests/quic_config.rs")
          text = p.read_text()
          tests = r'''

          #[test]
          fn global_http2_and_http3_can_coexist_on_one_tcp_listener() {
              let cfg = load(
                  r#"
          [global.http2]
          enabled = true
          [global.http3]
          enabled = true

          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            name = "web"
            type = "tls"
            match_sni = [".web.example"]
          "#,
              )
              .expect("global HTTP/2 and HTTP/3 should coexist");

              let tcp = &cfg.listeners[0];
              let route = &tcp.routes[0];
              let rt_tpl = cfg.template_for(&route.use_template).unwrap();
              let ln_tpl = cfg.template_for(&tcp.use_template).unwrap();
              assert!(cfg.effective_http2(tcp, route, rt_tpl, ln_tpl).enabled);
              assert!(cfg.effective_http3(tcp, route, rt_tpl, ln_tpl).enabled);

              let expanded = cfg.expanded_listeners().unwrap();
              assert_eq!(expanded.len(), 2);
              assert_eq!(expanded[0].transport, ListenerTransport::Tcp);
              assert_eq!(expanded[0].routes[0].route_type, Some(RouteType::Tls));
              assert_eq!(expanded[1].transport, ListenerTransport::Quic);
              assert_eq!(expanded[1].routes[0].route_type, Some(RouteType::H3));
          }

          #[test]
          fn route_http3_false_disables_a_global_default() {
              let cfg = load(
                  r#"
          [global.http3]
          enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            type = "tls"
            match_sni = ["disabled.example"]
              [listener.route.http3]
              enabled = false
          "#,
              )
              .unwrap();
              assert_eq!(cfg.expanded_listeners().unwrap().len(), 1);
          }

          #[test]
          fn listener_http3_false_disables_a_global_default() {
              let cfg = load(
                  r#"
          [global.http3]
          enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [listener.http3]
            enabled = false
            [[listener.route]]
            type = "tls"
            match_sni = ["disabled.example"]
          "#,
              )
              .unwrap();
              assert_eq!(cfg.expanded_listeners().unwrap().len(), 1);
          }

          #[test]
          fn template_can_enable_http3_companion() {
              let cfg = load(
                  r#"
          [templates.web]
          type = "tls"
            [templates.web.http3]
            enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            use = "web"
            match_sni = ["template.example"]
          "#,
              )
              .unwrap();
              let expanded = cfg.expanded_listeners().unwrap();
              assert_eq!(expanded.len(), 2);
              assert_eq!(expanded[1].routes[0].route_type, Some(RouteType::H3));
          }

          #[test]
          fn global_http3_maps_ech_to_h3_ech_and_raw_to_raw() {
              let cfg = load(
                  r#"
          [global.http3]
          enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            name = "private"
            type = "ech"
            match_sni = ["private.example"]
            [[listener.route]]
            name = "raw"
            type = "raw"
            match_sni = ["raw.example"]
          "#,
              )
              .unwrap();
              let expanded = cfg.expanded_listeners().unwrap();
              assert_eq!(expanded.len(), 2);
              assert_eq!(expanded[1].routes[0].route_type, Some(RouteType::H3Ech));
              assert_eq!(expanded[1].routes[1].route_type, Some(RouteType::Raw));
          }

          #[test]
          fn global_http3_skips_cleartext_http_routes_without_translation() {
              let cfg = load(
                  r#"
          [global.http3]
          enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            type = "http"
            match_sni = ["plain.example"]
          "#,
              )
              .unwrap();
              assert_eq!(cfg.expanded_listeners().unwrap().len(), 1);
          }

          #[test]
          fn explicit_route_http3_on_cleartext_http_is_rejected() {
              let error = load(
                  r#"
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            type = "http"
            match_sni = ["plain.example"]
              [listener.route.http3]
              enabled = true
          "#,
              )
              .expect_err("explicit HTTP/3 on a cleartext HTTP route is ambiguous");
              assert!(error.to_string().contains("http3 cannot be enabled explicitly"));
          }

          #[test]
          fn explicit_quic_listener_suppresses_automatic_companion() {
              let cfg = load(
                  r#"
          [global.http3]
          enabled = true
          [[listener]]
          addr = "127.0.0.1:443"
            [[listener.route]]
            type = "tls"
            match_sni = ["auto.example"]

          [[listener]]
          addr = "127.0.0.1:443"
          transport = "quic"
            [[listener.route]]
            type = "raw"
            match_sni = ["manual.example"]
          "#,
              )
              .unwrap();
              let expanded = cfg.expanded_listeners().unwrap();
              assert_eq!(expanded.len(), 2, "explicit QUIC must suppress synthetic UDP");
              let quic: Vec<_> = expanded
                  .iter()
                  .filter(|l| l.transport == ListenerTransport::Quic)
                  .collect();
              assert_eq!(quic.len(), 1);
              assert_eq!(quic[0].routes[0].route_type, Some(RouteType::Raw));
          }
          '''
          if "global_http2_and_http3_can_coexist_on_one_tcp_listener" in text:
