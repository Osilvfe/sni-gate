name: tmp-quic-ngtcp2-fix
on:
  push:
    branches:
      - tmp/quic-ngtcp2-interoperability
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/quic-ngtcp2-interoperability
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm cmake clang
      - name: Patch shared QUIC receive contract
        run: python .github/scripts/patch_quic_ngtcp2.py
      - run: cargo fmt --all
      - name: Focused regression tests
        run: cargo test --locked --test quic_h3_resilience --test http23_auto_e2e
      - name: Clippy affected targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit generated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/quic_socket.rs src/quic_proxy.rs tests/quic_h3_resilience.rs
          git commit -m 'fix(quic): accept large valid H3 datagrams'
          git push origin HEAD:tmp/quic-ngtcp2-interoperability
